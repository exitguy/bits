# Time from Home Assistant
time:
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Amsterdam"
    on_time_sync:
      then:
        - lvgl.label.update:
            id: lbl_time
            text: !lambda |-
              auto now = id(ha_time).now();
              static char buf[10];
              sprintf(buf, "%02d:%02d", now.hour, now.minute);
              return buf;

# Temperature sensor display
text_sensor:
  - platform: homeassistant
    id: ha_temperature
    entity_id: sensor.living_room_temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_temp
            text: !lambda |-
              static char buf[30];
              sprintf(buf, "Temp: %sC", x.c_str());
              return buf;
            
  - platform: homeassistant
    id: ha_humidity
    entity_id: sensor.living_room_humidity
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_humidity
            text: !lambda |-
              static char buf[30];
              sprintf(buf, "Humidity: %s%%", x.c_str());
              return buf;

# Climate temperature display
sensor:
  - platform: homeassistant
    id: ha_climate_temp
    entity_id: climate.living_room
    attribute: temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_climate_temp
            text: !lambda |-
              static char buf[10];
              sprintf(buf, "%.1fC", x);
              return buf;
