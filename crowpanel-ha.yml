    # === LIGHTS PAGE ===
    - obj:
        id: page_lights
        x: 0
        y: 0
        width: 100%
        height: 100%
        bg_color: 0xF0F0F0
        hidden: true
        bg_opa: COVER
        widgets:
          - button:
              x: 20
              y: 20
              width: 100
              height: 60
              bg_color: 0x95A5A6
              on_click:
                then:
                  - lvgl.widget.hide: page_lights
                  - lvgl.widget.show: page_home
              widgets:
                - label:
                    text: "Back"
                    align: CENTER
                    text_color: 0xFFFFFF

          - label:
              text: "Lights"
              align: TOP_MID
              y: 35
              text_color: 0x333333
              text_font: montserrat_28

          - button:
              x: 50
